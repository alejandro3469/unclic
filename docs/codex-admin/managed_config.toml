# Codex managed defaults template (managed_config.toml)
# Deploy path:
# - Unix: /etc/codex/managed_config.toml
# - Windows/non-Unix: ~/.codex/managed_config.toml
# - macOS MDM key: com.openai.codex -> config_toml_base64
#
# This file sets startup defaults. Users can still change values in-session.

# Conservative startup defaults.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Keep network disabled by default; enable only after security review.
network_access = false

[otel]
# Centralized telemetry defaults.
environment = "prod"
exporter = "otlp-http"
log_user_prompt = false

# Add exporter-specific details per your collector topology.
# Example (verify exact keys in your environment):
# [otel.exporter_otlp_http]
# endpoint = "https://otel-gateway.example.com/v1/traces"
