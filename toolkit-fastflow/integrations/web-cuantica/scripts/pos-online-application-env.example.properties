# =============================================================================
# PLANTILLA DE CONFIGURACIÓN POR ENTORNO (DEV / QAS / PRD)
# =============================================================================
# Este archivo NO se carga por Spring. Es una plantilla para que el usuario
# final cree sus propios application-envDev.properties, application-envQas.properties,
# application-envPrd.properties, etc., con SUS servidores, IPs y credenciales.
#
# Pasos:
# 1. Copia este archivo a application-envDev.properties (o envQas, envPrd, envPpr).
# 2. Sustituye todos los placeholders (TU_EUREKA_URL, TU_MYSQL_HOST, etc.) por
#    tus valores reales. No subas archivos con contraseñas al control de versiones.
# 3. El perfil por defecto en application.properties es "local". Para usar otro
#    perfil: spring.profiles.active=envDev (o envQas, envPrd, envPpr).
# =============================================================================

spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false
eureka.client.serviceUrl.registerWithEureka=false

spring.application.name=sm-core-web
eureka.instance.instance-id=${spring.cloud.client.hostname}:${server.port}:${spring.application.name}:${random.value}
eureka.client.service-url.defaultZone=http://TU_EUREKA_HOST:8761/eureka

# Base de datos principal
app.datasource.url=jdbc:mysql://TU_MYSQL_HOST:3306/TU_BASE_DATOS
app.datasource.username=TU_USUARIO
app.datasource.password=TU_PASSWORD
app.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8111
environment.active=DEV
app.version=2.0.0
management.endpoints.web.exposure.include=*

# RabbitMQ (opcional)
spring.rabbitmq.host=TU_RABBITMQ_HOST
spring.rabbitmq.port=5672
spring.rabbitmq.username=TU_USUARIO_RABBIT
spring.rabbitmq.password=TU_PASSWORD_RABBIT

# Ejemplo: integración JDE / generador de consecutivos (sustituir por tu URL)
# app.calzada.jde.consecutive.generator.url=http://TU_SERVIDOR_JDE:3101/order/next-order-number/
# app.calzada.jde.batchFolio.generator.url=http://TU_SERVIDOR_JDE:3101/order/next-batch-folio/

# Añade aquí las propiedades específicas de tu entorno (Oracle, SQL Server, colas, etc.)
# usando siempre placeholders o variables de entorno. No incluyas credenciales reales en el repo.
