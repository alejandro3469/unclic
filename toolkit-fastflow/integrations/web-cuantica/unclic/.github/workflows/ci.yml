# CI cuando este directorio es la raíz del repositorio (UnClic aislado o nucleic).
# Si unclic vive dentro de un monorepo mayor, copia este job al workflow del repo padre
# con defaults.run.working-directory o filtro paths.

name: UnClic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API — test + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  ping:
    name: Ping — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ping/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
