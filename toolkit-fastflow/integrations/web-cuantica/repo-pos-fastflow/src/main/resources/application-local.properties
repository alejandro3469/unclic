# ============================================================================
# CONFIGURACIÓN LOCAL - DESARROLLO SIN CONEXIONES REMOTAS
# ============================================================================
# Este perfil está diseñado para desarrollo local sin necesidad de conexiones
# a servidores o bases de datos de End to End.
# 
# Cuando implementes tus propias bases de datos y servidor AWS, actualiza
# las configuraciones comentadas en los archivos application-env*.properties
# ============================================================================

######									######
###### CONFIGURACIONES GOBALES			######
######									###### 

# Deshabilitar Eureka para desarrollo local
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false
eureka.client.serviceUrl.registerWithEureka=false

##EUREKA CONFIGURATION (Comentado - Configurar cuando tengas servidor propio)
#spring.application.name=sm-core-web
# Valor dummy para desarrollo local (Eureka está deshabilitado)
eureka.instance.instance-id=local-dev:${server.port}:sm-core-web:local
#eureka.client.service-url.defaultZone=http://TU_SERVIDOR_AWS:8761/eureka

## BASE DE DATOS PRINCIPAL - H2 EN MEMORIA (Para desarrollo local)
# Cuando tengas tu base de datos MySQL en AWS, reemplaza con:
# app.datasource.url=jdbc:mysql://TU_SERVIDOR_MYSQL_AWS:3306/pos_security
# app.datasource.username=tu_usuario
# app.datasource.password=tu_password
app.datasource.url=jdbc:h2:mem:pos_security_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.username=sa
app.datasource.password=
app.datasource.driver-class-name=org.h2.Driver

# Configuración H2 Console (accesible en http://localhost:8111/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## CONFIGURACION DE PUERTO, AMBIENTE Y VERSION
server.port=8111
app.version=2.0.0
environment.active=LOCAL
management.endpoints.web.exposure.include=*

## CONEXION A RABBIT MQ (Deshabilitado para desarrollo local)
# Cuando tengas RabbitMQ en AWS, configura:
# spring.rabbitmq.host=TU_SERVIDOR_RABBITMQ_AWS
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=tu_usuario
# spring.rabbitmq.password=tu_password
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Deshabilitar auto-configuración de RabbitMQ si no está disponible
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

##CONFIGURACION DE LOG
logging.file.name=sm-core-local.log
logging.file.max-size=50MB
logging.file.max-history=3
logging.file.clean-history-on-start=true
logging.level.root=INFO
logging.level.mx.com.endtoend=DEBUG

